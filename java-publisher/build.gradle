apply plugin: 'java'
apply plugin: 'application'

application {
    // application.mainClass is the supported way to declare the entry point in Gradle 9.x
    mainClass.set('org.example.Publisher')
}

// Configure the 'run' task JVM args so Agrona can access Unsafe on modern JDKs
run {
    jvmArgs = [
        '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-opens=java.base/java.util.zip=ALL-UNNAMED'
    ]
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

dependencies {
    implementation 'io.aeron:aeron-client:1.50.0-SNAPSHOT'
    implementation 'org.agrona:agrona:1.24.0'
}

// Keep compilation simple; adjust sourceCompatibility if needed
sourceCompatibility = 21

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

